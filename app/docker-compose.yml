services:
  harness:
    build: .
    container_name: deepseek-harness

    network_mode: host

    restart: unless-stopped

    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

    volumes:
      - ${DSH_DATA_ROOT:-/mnt/dsh-data}/dsh:/root/.dsh
      - ${DSH_DATA_ROOT:-/mnt/dsh-data}/workspace:/workspace

  discord:
    build:
      context: ../integrations/discord
    container_name: deepseek-harness-discord

    restart: unless-stopped

    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DSH_MODEL: ${DSH_MODEL:-deepseek-v4-flash}

    volumes:
      - ${DSH_DATA_ROOT:-/mnt/dsh-data}/discord-sessions:/data/sessions
      - ${DSH_DATA_ROOT:-/mnt/dsh-data}/workspace:/workspace