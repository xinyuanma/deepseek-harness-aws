services:
  harness:
    build: .
    container_name: deepseek-harness

    network_mode: host

    restart: unless-stopped

    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}

    volumes:
      - /mnt/dsh-data/dsh:/root/.dsh
      - /mnt/dsh-data/workspace:/workspace

volumes:
  harness-data:
  harness-workspace: